<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Parra Automoción - Venta de Vehículos y Taller 4x4{% endblock %}</title>
    <!-- Icono en la pestaña del navegador -->
    <link rel="icon" type="image/jpeg" href="{{ url_for('static', filename='img/logo.jpeg') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>

    <header>
        <a href="/" class="brand-logo-link">
            <img src="{{ url_for('static', filename='img/logo.jpeg') }}" alt="Parra Automoción Logo" class="header-logo">
            <div class="logo-title">PARRA <span>AUTOMOCIÓN</span></div>
        </a>
        <nav>
            <a href="/" 
               class="{% if request.endpoint == 'web.index' %}nav-active{% endif %}"
               {% if request.endpoint == 'web.index' %}aria-current="page"{% endif %}>Inicio</a>
            
            <a href="/catalogo" 
               class="{% if request.endpoint == 'web.catalogo' and not request.args.get('cat') %}nav-active{% endif %}"
               {% if request.endpoint == 'web.catalogo' and not request.args.get('cat') %}aria-current="page"{% endif %}>Vehículos</a>
            
            <a href="/catalogo?cat=4x4" 
               class="{% if request.endpoint == 'web.catalogo' and request.args.get('cat') == '4x4' %}nav-active{% endif %}"
               {% if request.endpoint == 'web.catalogo' and request.args.get('cat') == '4x4' %}aria-current="page"{% endif %}>4x4 / Todoterreno</a>
            
            <a href="/catalogo?cat=Turismo" 
               class="{% if request.endpoint == 'web.catalogo' and request.args.get('cat') == 'Turismo' %}nav-active{% endif %}"
               {% if request.endpoint == 'web.catalogo' and request.args.get('cat') == 'Turismo' %}aria-current="page"{% endif %}>Turismos</a>
            
            <a href="/taller" 
               class="{% if request.endpoint == 'web.taller' %}nav-active{% endif %}"
               {% if request.endpoint == 'web.taller' %}aria-current="page"{% endif %}>Taller Mecánico</a>
            
            <a href="/contacto" 
               class="{% if request.endpoint == 'web.contacto' %}nav-active{% endif %}"
               {% if request.endpoint == 'web.contacto' %}aria-current="page"{% endif %}>Contacto</a>
            
            <a href="/admin" 
               class="btn-admin-nav {% if request.endpoint == 'web.admin' %}nav-active-admin{% endif %}">Panel Admin</a>
        </nav>
    </header>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer>
        <p>&copy; 2026 Parra Automoción — Fuentes de León (Badajoz). Especialistas en 4x4 y Multimarca.</p>
    </footer>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
